x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  beszel:
    <<: *default-logging
    container_name: beszel
    image: henrygd/beszel:0.19.0
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    <<: *default-logging
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.19.0
    restart: unless-stopped
    environment:
      - HUB_URL=http://beszel:8090
      - KEY=${BESZEL_KEY}
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${BESZEL_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./beszel_socket:/beszel_socket

  home-assistant:
    <<: *default-logging
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    restart: unless-stopped
    volumes:
      - ./home_assistant_config:/config
    network_mode: host

  matterjs-server:
    <<: *default-logging
    container_name: matterjs-server
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    restart: unless-stopped
    user: 0:0
    volumes:
      - ./matterjs_server_data:/data
    network_mode: host
