theme:
  background-color: 50 1 6
  primary-color: 24 97 58
  negative-color: 209 88 54

pages:
  - name: Home
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Beszel
                url: https://beszel.ocd.beauty
                icon: sh:beszel

              - title: Continuwuity
                url: https://continuwuity.ocd.beauty
                icon: sh:continuwuity

              - title: Dufs
                url: https://dufs.ocd.beauty
                icon: sh:dufs.webp

              - title: Gonic
                url: https://gonic.ocd.beauty
                icon: sh:gonic.webp

          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

          - type: group
            widgets:
              - type: reddit
                subreddit: technology
                show-thumbnails: true
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true

      - size: small
        widgets:
          - type: weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: releases
            cache: 1d
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing
